name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        # Warnings and errors only. Non-blocking at first; remove continue-on-error
        # once the existing findings have been cleaned up.
        continue-on-error: true
        run: shellcheck --severity=warning --shell=bash ./*.sh bashrc-user bash_aliases
